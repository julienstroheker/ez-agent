# Simple Agent Example
# A basic conversational agent - perfect for getting started
#
# Run with: ezagent run -c examples/simple-agent.yaml -m terminal

name: SimpleAgent
description: A simple AI assistant for testing and experimentation
version: 1.0.0

instructions: |
  You are a helpful AI assistant called SimpleAgent.
  
  Guidelines:
  - Be concise and clear in your responses
  - If you don't know something, say so honestly
  - Be friendly and professional

model: gpt-4o

configuration:
  provider: azure_foundry
  azure:
    endpoint: ${AZURE_AI_ENDPOINT}
    auth_method: default_credential
  logging:
    level: INFO
    format: console

features:
  streaming: true
  tool_execution: true
  conversation_history: true

tools: []
